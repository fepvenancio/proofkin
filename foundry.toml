[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = [
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]
solc = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "fixtures" },
    { access = "read-write", path = "fixtures/renders" },
]
gas_limit = 9223372036854775807

[fuzz]
runs = 512

[invariant]
runs = 32
depth = 120

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
